<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pronoun Referencing Practice — Login</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-body">
<div class="login-container">
  <div class="login-hero">
    <i class="fas fa-book-reader login-icon"></i>
    <h1>Pronoun Referencing<br>Practice</h1>
    <p>Interactive English Exercise</p>
    <div class="login-features">
      <div><i class="fas fa-check-circle"></i> 25 Interactive Questions</div>
      <div><i class="fas fa-check-circle"></i> Step-by-Step Guidance</div>
      <div><i class="fas fa-check-circle"></i> Instant Feedback</div>
      <div><i class="fas fa-check-circle"></i> Class Leaderboard</div>
    </div>
  </div>
  <div class="login-form-section">
    <h2><i class="fas fa-sign-in-alt"></i> Sign In</h2>
    <div id="errorMsg" class="alert alert-error" style="display:none"></div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group"><label><i class="fas fa-user"></i> Username</label>
        <input type="text" id="username" required autofocus placeholder="Enter your username"></div>
      <div class="form-group"><label><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" required placeholder="Enter your password"></div>
      <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-arrow-right"></i> Login</button>
    </form>
    <div style="text-align:center;margin-top:20px;padding-top:20px;border-top:1px solid #E1E8ED">
      <p style="font-size:14px;color:#7F8C8D;margin-bottom:12px">Don't have an account yet?</p>
      <a href="register.html" class="btn btn-success btn-block"><i class="fas fa-user-plus"></i> Create New Account</a>
    </div>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async(e)=>{
    e.preventDefault();
    const errDiv=document.getElementById('errorMsg');
    errDiv.style.display='none';
    const resp=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const data=await resp.json();
    if(data.ok){window.location.href=data.redirect;}
    else{errDiv.innerHTML='<i class="fas fa-exclamation-circle"></i> '+data.error;errDiv.style.display='block';}
});
</script>
</body></html>
